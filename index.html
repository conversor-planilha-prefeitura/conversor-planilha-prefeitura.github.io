<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Conversor NFS-e · Acesso</title>
<style>
  html{color-scheme:light dark;}
  :root{--bg:#fff;--surface:#fff;--ink:#231416;--dim:#6e5457;--accent:#c1272d;--accent-strong:#921e23;--accent-ink:#fff;--line:#e6d4d5;--warn:#a1481c;}
  @media (prefers-color-scheme: dark){:root{--bg:#0a0a0a;--surface:#161010;--ink:#f2e8e8;--dim:#ab8f8f;--accent:#ff5757;--accent-strong:#e63b3b;--accent-ink:#1a0505;--line:#332222;--warn:#e2915c;}}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px;}
  form{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 24px;}
  .eyebrow{font:12px ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0 0 10px;}
  h1{font-size:22px;margin:0 0 6px;}
  p{font-size:14px;color:var(--dim);margin:0 0 18px;line-height:1.5;}
  input[type=password]{width:100%;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);}
  label.rem{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--dim);margin:12px 0 16px;}
  button{width:100%;font-size:15px;font-weight:600;padding:12px;border:none;border-radius:9px;background:var(--accent);color:var(--accent-ink);cursor:pointer;}
  button:hover{background:var(--accent-strong);}
  button:disabled{opacity:.6;cursor:wait;}
  .err{color:var(--warn);font-size:13px;min-height:1.2em;margin:10px 0 0;}
</style>
</head>
<body>
<form id="f">
  <div class="eyebrow">Conversor NFS-e</div>
  <h1>Acesso para clientes</h1>
  <p>Digite a senha que você recebeu ao contratar o serviço.</p>
  <input type="password" id="pw" autocomplete="current-password" placeholder="Senha" required autofocus>
  <label class="rem"><input type="checkbox" id="rem"> Lembrar neste navegador</label>
  <button id="btn">Entrar</button>
  <div class="err" id="err"></div>
</form>

  const KEY="nfse_conversor_senha";
  const dec = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function abrir(senha){
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(senha), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:dec(SALT), iterations:ITER, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:dec(IV)}, key, dec(DATA));
    return new TextDecoder().decode(pt);
  }
  function mostrar(html){ document.open(); document.write(html); document.close(); }
  const f=document.getElementById("f"), pw=document.getElementById("pw"), rem=document.getElementById("rem"), btn=document.getElementById("btn"), err=document.getElementById("err");
  let salva=null;
  try{ salva=localStorage.getItem(KEY); }catch(e){}
  if(salva){ abrir(salva).then(mostrar).catch(()=>{ try{ localStorage.removeItem(KEY); }catch(e){} }); }
  f.addEventListener("submit", async e => {
    e.preventDefault();
    btn.disabled=true; err.textContent="";
    try{
      const html = await abrir(pw.value);
      if(rem.checked){ try{ localStorage.setItem(KEY, pw.value); }catch(e){} }
      mostrar(html);
    }catch(e){
      err.textContent="Senha incorreta."; btn.disabled=false; pw.select();
    }
  });
})();
</script>
