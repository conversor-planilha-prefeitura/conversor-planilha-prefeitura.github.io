<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Conversor NFS-e · Acesso</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<style>
  html{color-scheme:light dark;}
  :root{--bg:#fff;--surface:#fff;--surface-2:#f5ecec;--ink:#231416;--dim:#6e5457;--accent:#c1272d;--accent-strong:#921e23;--accent-ink:#fff;--line:#e6d4d5;--warn:#a1481c;--ok:#2e7d4f;}
  @media (prefers-color-scheme: dark){:root{--bg:#0a0a0a;--surface:#161010;--surface-2:#201717;--ink:#f2e8e8;--dim:#ab8f8f;--accent:#ff5757;--accent-strong:#e63b3b;--accent-ink:#1a0505;--line:#332222;--warn:#e2915c;--ok:#6fcf97;}}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px;}
  .card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 24px;}
  .eyebrow{font:12px ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0 0 10px;}
  h1{font-size:21px;margin:0 0 6px;}
  p{font-size:14px;color:var(--dim);margin:0 0 16px;line-height:1.5;}
  .tabs{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:10px;margin-bottom:18px;}
  .tabs button{flex:1;background:transparent;color:var(--dim);border:none;border-radius:7px;padding:8px;font-size:13.5px;font-weight:500;cursor:pointer;}
  .tabs button.on{background:var(--accent);color:var(--accent-ink);}
  label{display:block;font-size:12.5px;color:var(--dim);margin:0 0 4px;}
  input{width:100%;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);margin-bottom:12px;}
  .btn{width:100%;font-size:15px;font-weight:600;padding:12px;border:none;border-radius:9px;background:var(--accent);color:var(--accent-ink);cursor:pointer;margin-top:4px;}
  .btn:hover{background:var(--accent-strong);}
  .btn:disabled{opacity:.6;cursor:wait;}
  .btn.sec{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);}
  .msg{font-size:13px;min-height:1.2em;margin:10px 0 0;color:var(--warn);}
  .msg.ok{color:var(--ok);}
  .link{background:none;border:none;color:var(--accent);text-decoration:underline;cursor:pointer;font-size:13px;padding:0;margin-top:12px;}
  [hidden]{display:none !important;}
  body.app{display:block;padding:0;min-height:0;place-items:normal;}
  #telaApp{width:100%;}
  .bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--surface);font-size:13px;}
  .bar .marca{font:12px ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-right:auto;}
  .bar .plano{color:var(--dim);}
  .bar .plano.fim{color:var(--warn);}
  .bar button{font-size:12.5px;font-weight:500;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);cursor:pointer;}
  .bar button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:22px;width:min(440px,calc(100vw - 32px));max-height:calc(100vh - 32px);}
  dialog::backdrop{background:#0006;}
  dialog h2{font-size:19px;margin:0 0 6px;}
  dialog h3{font-size:14px;margin:20px 0 8px;}
  .pg{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line);color:var(--dim);}
  #frame{display:block;width:100%;border:0;height:calc(100vh - 50px);}

</style>
</head>
<body>
<div class="card">
  <div class="eyebrow">Conversor NFS-e</div>

  <div id="carregando"><p>Carregando…</p></div>

  <div id="telaAuth" hidden>
    <div class="tabs" role="tablist">
      <button type="button" id="tabEntrar" class="on">Entrar</button>
      <button type="button" id="tabCriar">Criar conta</button>
    </div>
    <form id="formEntrar">
      <label for="eEmail">E-mail</label>
      <input id="eEmail" type="email" autocomplete="email" required>
      <label for="eSenha">Senha</label>
      <input id="eSenha" type="password" autocomplete="current-password" required>
      <button class="btn">Entrar</button>
      <button type="button" class="link" id="esqueci">Esqueci minha senha</button>
    </form>
    <form id="formCriar" hidden>
      <p>Crie sua conta e use grátis por 1 dia(s). Depois, R$ 200 a cada 30 dias.</p>
      <label for="cNome">Nome</label>
      <input id="cNome" autocomplete="name" required>
      <label for="cEmpresa">Empresa</label>
      <input id="cEmpresa" autocomplete="organization">
      <label for="cEmail">E-mail</label>
      <input id="cEmail" type="email" autocomplete="email" required>
      <label for="cSenha">Senha (mínimo 8 caracteres)</label>
      <input id="cSenha" type="password" autocomplete="new-password" minlength="8" required>
      <button class="btn">Criar conta e testar grátis</button>
    </form>
    <div class="msg" id="msgAuth" role="status"></div>
  </div>

  <form id="telaNovaSenha" hidden>
    <h1>Crie sua senha</h1>
    <p id="nsTexto">Este é seu primeiro acesso. Troque a senha provisória por uma só sua.</p>
    <label for="ns1">Nova senha (mínimo 8 caracteres)</label>
    <input id="ns1" type="password" autocomplete="new-password" minlength="8" required>
    <label for="ns2">Repita a nova senha</label>
    <input id="ns2" type="password" autocomplete="new-password" minlength="8" required>
    <button class="btn">Salvar senha</button>
    <div class="msg" id="msgNovaSenha" role="status"></div>
  </form>

  <div id="telaStatus" hidden>
    <h1 id="stTitulo"></h1>
    <p id="stTexto"></p>
    <button type="button" class="btn" id="stPagar" hidden>Pagar R$ 200 (30 dias)</button>
    <button type="button" class="btn sec" id="stPerfil">Meu perfil</button>
    <button type="button" class="btn sec" id="sair">Sair</button>
    <div class="msg" id="msgStatus" role="status"></div>
  </div>
</div>

<div id="telaApp" hidden>
  <div class="bar">
    <span class="marca">Conversor NFS-e</span>
    <span class="plano" id="plano"></span>
    <button type="button" id="btnPerfil">Meu perfil</button>
    <button type="button" class="pri" id="btnPagar">Renovar · R$ 200</button>
    <button type="button" id="sair2">Sair</button>
  </div>
  <iframe id="frame" title="Conversor NFS-e"></iframe>
</div>

<dialog id="dlgPerfil">
  <h2>Meu perfil</h2>
  <p id="pfStatus"></p>
  <form id="formPerfil">
    <label>E-mail</label>
    <input id="pfEmail" disabled>
    <label for="pfNome">Nome</label>
    <input id="pfNome" autocomplete="name">
    <label for="pfEmpresa">Empresa</label>
    <input id="pfEmpresa" autocomplete="organization">
    <button class="btn">Salvar dados</button>
    <div class="msg" id="msgPerfil" role="status"></div>
  </form>
  <h3>Trocar senha</h3>
  <form id="formSenhaPerfil">
    <input id="pfSenha" type="password" autocomplete="new-password" minlength="8" placeholder="Nova senha (mínimo 8)" required>
    <button class="btn sec">Trocar senha</button>
    <div class="msg" id="msgSenhaPerfil" role="status"></div>
  </form>
  <h3>Pagamentos</h3>
  <div id="pfPagamentos"></div>
  <button type="button" class="btn sec" id="fecharPerfil" style="margin-top:16px">Fechar</button>
</dialog>

  const $ = id => document.getElementById(id);
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const dec = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

  function mostrar(id){
    for(const t of ["carregando","telaAuth","telaNovaSenha","telaStatus"]) $(t).hidden = (t !== id);
  }
  function msg(texto, ok){ $("msgAuth").textContent = texto; $("msgAuth").classList.toggle("ok", !!ok); }

  let sessao = null, acesso = null, conversorHtml = null;
  let recuperando = /type=recovery/.test(location.hash);
  const fmtData = d => new Date(d).toLocaleDateString("pt-BR");

  async function decifrar(chaveB64){
    const key = await crypto.subtle.importKey("raw", dec(chaveB64), "AES-GCM", false, ["decrypt"]);
    const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:dec(IV)}, key, dec(DATA));
    return new TextDecoder().decode(pt);
  }

  function carregarConversor(){
    const ctx = { userId: sessao.user.id };
    const html = conversorHtml.replace("<head>", "<head><script>window.NFSE_CTX=" + JSON.stringify(ctx) + "<\/script>");
    $("frame").srcdoc = html;
  }

  function status(titulo, texto, pagar){
    $("stTitulo").textContent = titulo;
    $("stTexto").textContent = texto;
    $("stPagar").hidden = !pagar;
    document.body.classList.remove("app");
    $("telaApp").hidden = true;
    mostrar("telaStatus");
  }

  async function verificar(){
    const { data: { session } } = await sb.auth.getSession();
    sessao = session;
    if(!session){ mostrar("telaAuth"); return; }
    if(recuperando){ pedirNovaSenha("Crie uma nova senha para sua conta."); return; }
    // Conta criada por você no Supabase com senha provisória: o cliente cria a dele antes de seguir.
    if(!(session.user.user_metadata || {}).trocou_senha){ pedirNovaSenha("Este é seu primeiro acesso. Troque a senha provisória por uma só sua."); return; }
    sb.rpc("registrar_ip").then(() => {}, () => {});
    const { data, error } = await sb.from("acessos").select("status,valido_ate,nome,empresa,sem_teste").eq("user_id", session.user.id).maybeSingle();
    if(error){ status("Erro ao verificar acesso", error.message); return; }
    acesso = data || { status: "pendente" };
    if(acesso.status === "recusado"){
      status("Acesso não liberado", "Sua conta (" + session.user.email + ") não está liberada. Se você contratou o serviço, fale com a gente.");
      return;
    }
    if(acesso.status !== "aprovado"){
      if(acesso.sem_teste) status("Teste grátis já usado", "Este navegador já usou o teste grátis em outra conta. Para usar com " + session.user.email + ", pague R$ 200 e o acesso é liberado na hora por 30 dias.", true);
      else status("Cadastro recebido", "Sua conta (" + session.user.email + ") está aguardando liberação. Se preferir, pague agora e o acesso é liberado na hora por 30 dias.", true);
      return;
    }
    const ate = acesso.valido_ate ? new Date(acesso.valido_ate) : null;
    if(!ate || ate <= new Date()){
      status("Seu acesso terminou", (ate ? "Seu acesso venceu em " + fmtData(ate) + ". " : "") + "Para continuar usando o conversor, pague R$ 200 e ganhe mais 30 dias de acesso.", true);
      return;
    }
    const { data: seg, error: e2 } = await sb.from("segredo").select("chave").eq("id", 1).maybeSingle();
    if(e2 || !seg){ status("Erro ao abrir o conversor", (e2 && e2.message) || "Chave não encontrada."); return; }
    try{ conversorHtml = await decifrar(seg.chave); }
    catch(e){ status("Erro ao abrir o conversor", "A chave não confere com esta versão do site."); return; }
    const dias = Math.ceil((ate - new Date()) / 86400000);
    $("plano").textContent = "Acesso até " + fmtData(ate) + (dias <= 3 ? " (faltam " + dias + (dias === 1 ? " dia)" : " dias)") : "");
    $("plano").classList.toggle("fim", dias <= 3);
    $("carregando").parentElement.hidden = true;
    document.body.classList.add("app");
    $("telaApp").hidden = false;
    carregarConversor();
  }

  // ----- nova senha -----
  function pedirNovaSenha(texto){
    $("nsTexto").textContent = texto;
    $("msgNovaSenha").textContent = "";
    document.body.classList.remove("app"); $("telaApp").hidden = true; $("carregando").parentElement.hidden = false;
    mostrar("telaNovaSenha");
  }
  $("telaNovaSenha").addEventListener("submit", async ev => {
    ev.preventDefault();
    if($("ns1").value !== $("ns2").value){ $("msgNovaSenha").textContent = "As senhas não são iguais."; return; }
    const btn = ev.submitter; if(btn) btn.disabled = true;
    const { error } = await sb.auth.updateUser({ password: $("ns1").value, data: { trocou_senha: true } });
    if(btn) btn.disabled = false;
    if(error){ $("msgNovaSenha").textContent = /different|same/i.test(error.message) ? "A nova senha precisa ser diferente da atual." : error.message; return; }
    ev.target.reset(); recuperando = false;
    mostrar("carregando"); verificar();
  });

  // ----- perfil -----
  async function abrirPerfil(){
    const a = acesso || {};
    $("pfEmail").value = sessao.user.email;
    $("pfNome").value = a.nome || "";
    $("pfEmpresa").value = a.empresa || "";
    const ate = a.valido_ate ? new Date(a.valido_ate) : null;
    $("pfStatus").textContent =
      a.status === "aprovado" ? (ate && ate > new Date() ? "Acesso liberado até " + fmtData(ate) + "." : "Acesso vencido.")
      : a.status === "recusado" ? "Acesso não liberado." : "Cadastro aguardando aprovação.";
    for(const id of ["msgPerfil","msgSenhaPerfil"]) $(id).textContent = "";
    const box = $("pfPagamentos"); box.textContent = "Carregando…";
    $("dlgPerfil").showModal();
    const { data } = await sb.from("pagamentos").select("valor,criado_em").order("criado_em", { ascending:false });
    box.innerHTML = "";
    if(!data || !data.length){ box.textContent = "Nenhum pagamento ainda."; return; }
    for(const p of data){
      const r = document.createElement("div"); r.className = "pg";
      const d = document.createElement("span"); d.textContent = fmtData(p.criado_em);
      const v = document.createElement("span"); v.textContent = "R$ " + Number(p.valor).toFixed(2).replace(".", ",");
      r.append(d, v); box.appendChild(r);
    }
  }
  $("btnPerfil").onclick = abrirPerfil;
  $("stPerfil").onclick = abrirPerfil;
  $("fecharPerfil").onclick = () => $("dlgPerfil").close();
  $("formPerfil").addEventListener("submit", async ev => {
    ev.preventDefault();
    const nome = $("pfNome").value.trim(), empresa = $("pfEmpresa").value.trim();
    const { error } = await sb.rpc("atualizar_perfil", { p_nome: nome, p_empresa: empresa });
    $("msgPerfil").classList.toggle("ok", !error);
    $("msgPerfil").textContent = error ? error.message : "Dados salvos.";
    if(!error && acesso){ acesso.nome = nome; acesso.empresa = empresa; }
  });
  $("formSenhaPerfil").addEventListener("submit", async ev => {
    ev.preventDefault();
    const { error } = await sb.auth.updateUser({ password: $("pfSenha").value, data: { trocou_senha: true } });
    $("msgSenhaPerfil").classList.toggle("ok", !error);
    $("msgSenhaPerfil").textContent = error ? (/different|same/i.test(error.message) ? "A nova senha precisa ser diferente da atual." : error.message) : "Senha trocada.";
    if(!error) ev.target.reset();
  });

  // ----- pagamento -----
  async function pagar(btn, msgEl){
    btn.disabled = true; msgEl.textContent = "";
    try{
      const { data, error } = await sb.functions.invoke("criar-pagamento", { body: { voltar: location.href.split(/[?#]/)[0] } });
      if(error || !data || !data.url) throw new Error((data && data.erro) || (error && error.message) || "Não consegui gerar o pagamento.");
      location.href = data.url;
    }catch(e){
      msgEl.textContent = /edge function|failed to (send|fetch)|not found|404/i.test(e.message) ? "O pagamento online ainda não está disponível. Fale com a gente." : e.message;
      btn.disabled = false;
    }
  }
  $("stPagar").onclick = () => pagar($("stPagar"), $("msgStatus"));
  $("btnPagar").onclick = () => { $("telaApp").hidden = true; document.body.classList.remove("app"); $("carregando").parentElement.hidden = false;
    status("Renovar acesso", "Pague R$ 200 por Pix ou cartão e ganhe mais 30 dias, somados ao que você já tem.", true);
    $("sair").textContent = "Voltar"; $("sair").onclick = () => location.reload(); };
  $("sair2").onclick = async () => { await sb.auth.signOut(); location.reload(); };

  // Voltando do Mercado Pago: o aviso do pagamento pode levar alguns segundos.
  async function aguardarPagamento(){
    const q = new URLSearchParams(location.search);
    if(!q.has("payment_id") && !q.has("collection_id")) return;
    history.replaceState(null, "", location.pathname);
    if(!/approved/.test(q.get("status") || q.get("collection_status") || "")) return;
    for(let i = 0; i < 10; i++){
      await verificar();
      if(!$("telaApp").hidden) return;
      $("msgStatus").textContent = "Pagamento recebido. Liberando seu acesso…";
      $("msgStatus").classList.add("ok");
      await new Promise(r => setTimeout(r, 3000));
    }
    $("msgStatus").textContent = "O pagamento está sendo processado. Entre de novo em alguns minutos.";
  }

  // Marca o navegador para o teste grátis valer uma vez por navegador.
  function dispositivo(){
    let id = null;
    try{ id = localStorage.getItem("nfse_dispositivo"); }catch(e){}
    if(!id){
      id = crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now();
      try{ localStorage.setItem("nfse_dispositivo", id); }catch(e){}
    }
    return id;
  }
  async function impressao(){
    const t = [navigator.userAgent, navigator.language, screen.width + "x" + screen.height, screen.colorDepth,
      Intl.DateTimeFormat().resolvedOptions().timeZone, navigator.hardwareConcurrency || ""].join("|");
    const h = new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)));
    return [...h.slice(0, 8)].map(b => b.toString(16).padStart(2, "0")).join("");
  }

  async function avisarAdmin(nome, empresa, email){
    if(!WEB3FORMS_KEY || WEB3FORMS_KEY.indexOf("__") === 0) return;
    try{
      await fetch("https://api.web3forms.com/submit", {
        method:"POST",
        headers:{ "Content-Type":"application/json", "Accept":"application/json" },
        body: JSON.stringify({
          access_key: WEB3FORMS_KEY,
          subject: "Novo cliente no Conversor NFS-e (em teste grátis)",
          from_name: "Conversor NFS-e",
          nome, empresa: empresa || "-", email,
          message: "Novo cadastro começou o teste grátis.\nVeja ou bloqueie em: " + ADMIN_URL,
        }),
      });
    }catch(e){}
  }

  $("tabEntrar").onclick = () => { $("tabEntrar").classList.add("on"); $("tabCriar").classList.remove("on"); $("formEntrar").hidden=false; $("formCriar").hidden=true; msg(""); };
  $("tabCriar").onclick  = () => { $("tabCriar").classList.add("on"); $("tabEntrar").classList.remove("on"); $("formCriar").hidden=false; $("formEntrar").hidden=true; msg(""); };

  $("formEntrar").addEventListener("submit", async e => {
    e.preventDefault();
    const btn = e.submitter; if(btn) btn.disabled = true; msg("");
    const { error } = await sb.auth.signInWithPassword({ email: $("eEmail").value.trim(), password: $("eSenha").value });
    if(btn) btn.disabled = false;
    if(error){
      msg(/confirm/i.test(error.message) ? "Confirme seu e-mail pelo link que enviamos antes de entrar." : "E-mail ou senha incorretos.");
      return;
    }
    mostrar("carregando"); verificar();
  });

  $("formCriar").addEventListener("submit", async e => {
    e.preventDefault();
    const btn = e.submitter; if(btn) btn.disabled = true; msg("");
    const nome = $("cNome").value.trim(), empresa = $("cEmpresa").value.trim(), email = $("cEmail").value.trim();
    const { data, error } = await sb.auth.signUp({
      email, password: $("cSenha").value,
      options: { data: { nome, empresa, trocou_senha: true, dispositivo: dispositivo(), impressao: await impressao() }, emailRedirectTo: location.href.split("#")[0] },
    });
    if(btn) btn.disabled = false;
    if(error){
      const m = error.message || "";
      msg(/registered|already/i.test(m) ? "Este e-mail já tem conta. Use a aba Entrar."
        : /signups? not allowed|disabled/i.test(m) ? "Novos cadastros estão fechados no momento. Fale com a gente."
        : /password/i.test(m) ? "Senha fraca: use pelo menos 8 caracteres."
        : /rate limit/i.test(m) ? "Muitas tentativas. Espere alguns minutos e tente de novo."
        : m);
      return;
    }
    await avisarAdmin(nome, empresa, email);
    if(data.session){ mostrar("carregando"); verificar(); }
    else { msg("Conta criada. Confirme seu e-mail pelo link que enviamos e depois entre pela aba Entrar.", true); e.target.reset(); }
  });

  $("esqueci").onclick = async () => {
    const email = $("eEmail").value.trim();
    if(!email){ msg("Digite seu e-mail acima e clique de novo."); return; }
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.href.split("#")[0] });
    msg(error ? error.message : "Se o e-mail tiver conta, enviamos um link para criar uma nova senha.", !error);
  };

  $("sair").onclick = async () => { await sb.auth.signOut(); location.reload(); };

  sb.auth.onAuthStateChange(async (ev) => {
    if(ev === "PASSWORD_RECOVERY"){ recuperando = true; pedirNovaSenha("Crie uma nova senha para sua conta."); }
  });

  verificar().then(aguardarPagamento).catch(e => status("Erro", String(e && e.message || e)));
})();
</script>
</body>
</html>
